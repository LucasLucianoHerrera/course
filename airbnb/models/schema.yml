models:
  - name: dim_listings_cleansed
    description: Cleansed table wich contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
            severity: error
    columns:
    - name: listing_id
      description: Primary key for the listing
      data_tests:
        - unique
        - not_null
    - name: host_id
      description: The host's id. References the host table.
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_hosts_cleansed')
              field: host_id
    - name: room_type
      description: Type of apartment/rooms.
      data_tests:
        - accepted_values:
            arguments:
              values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
    - name: minimum_nights
      description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
      data_tests:
        - positive_values

  - name: dim_hosts_cleansed
    description: Cleansed dimension table containing host profile information and superhost status.
    config:
      contract:
        enforced: true    
    columns:
    - name: host_id
      description: Unique identifier for each host. Primary key.
      data_type: integer
      constraints:
        - type: not_null
      data_tests:
        - unique
    - name: host_name
      description: Name of the host as listed on their profile.
      data_type: string
      constraints:
        - type: not_null
    - name: is_superhost
      description: Flag indicating whether the host has superhost status ('t' for True, 'f' for False).
      data_type: string
      data_tests:
        - accepted_values:
            arguments:
              values: ['t', 'f']
    - name: updated_at
      description: Timestamp indicating when the host profile was last modified.
      data_type: timestamp
    - name: created_at
      description: Timestamp indicating when the host profile was created.
      data_type: timestamp

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb','listings')
    columns:
      - name: price
        tests:
            - dbt_expectations.expect_column_quantile_values_to_be_between:
                arguments:
                  quantile: .99
                  min_value: 50 # (Optional)
                  max_value: 500 # (Optional)
            - dbt_expectations.expect_column_values_to_be_of_type:
                arguments:
                  column_type: number
            - dbt_expectations.expect_column_max_to_be_between:
                arguments:
                  max_value: 5000 # (Optional)
                  config:
                    severity: warn

  - name: fct_reviews
    columns:
    - name: review_id
      data_tests:
        - not_null
        - unique
    - name: listing_id
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_listings_cleansed')
              field: listing_id
    - name: review_date
      data_tests:
        - not_null
    - name: reviewer_name
      data_tests:
        - not_null
    - name: review_sentiment
      data_tests:
        - accepted_values:
            arguments:
              values: ['positive', 'neutral', 'negative']

